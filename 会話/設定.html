<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Pokenia's Javascript Tools</title>
</head>
<body bgcolor="midnightblue ">
<div id="t1"></div>
<input type="button" value="button" onclick="適用()">
<script>
document.getElementById("t1").innerHTML =`木　<label><input type="radio" name="木" value="多い"checked>多い</label>　<label><input type="radio" name="木" value="少ない">少ない</label><br>
水　<label><input type="radio" name="水" value="多い"checked>多い</label>　<label><input type="radio" name="水" value="少ない">少ない</label><br>
ゴミ　<label><input type="radio" name="ゴミ" value="少ない"checked>少ない</label>　<label><input type="radio" name="ゴミ" value="多い">多い</label><br>
空気　<label><input type="radio" name="空気" value="きれい"checked>きれい</label>　<label><input type="radio" name="空気" value="汚い">汚い</label><br>
食料　<label><input type="radio" name="食料" value="多い"checked>多い</label>　<label><input type="radio" name="食料" value="少ない">少ない</label><br>
`

function 適用(){

elements = document.getElementsByName("木");
for (let i = 0; i < 2; i++){
    if (elements.item(i).checked){
        木材value = elements.item(i).value;
        
    }
}

elements = document.getElementsByName("水");
for (let i = 0; i < 2; i++){
    if (elements.item(i).checked){
        水value = elements.item(i).value;
        
    }
}

elements = document.getElementsByName("ゴミ");
for (let i = 0; i < 2; i++){
    if (elements.item(i).checked){
        ゴミvalue = elements.item(i).value;
        
    }
}

elements = document.getElementsByName("空気");
for (let i = 0; i < 2; i++){
    if (elements.item(i).checked){
        空気value = elements.item(i).value;
        
    }
}

elements = document.getElementsByName("食料");
for (let i = 0; i < 2; i++){
    if (elements.item(i).checked){
        食料value = elements.item(i).value;
        
    }
}


localStorage.setItem("木", `${木材value}`);
localStorage.setItem("水", `${水value}`);
localStorage.setItem("ゴミ", `${ゴミvalue}`);
localStorage.setItem("空気", `${空気value}`);
localStorage.setItem("食料", `${食料value}`);
}

</script>
</body>
<style>
#t1{
font-size: 20px;
color: white;
-webkit-text-size-adjust: none;
}
</style>
</html>
