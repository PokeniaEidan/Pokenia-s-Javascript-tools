<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Pokenia's Javascript Tools</title>
</head>
<body bgcolor="midnightblue ">
<div id="t1"></div>
<script>

document.getElementById("t1").innerHTML =`木　${木変数}<br>
水　${水変数}<br>
ゴミ　${ゴミ変数}<br>

`




</script>
</body>
<style>
#t1{
font-size: 20px;
color: white;
-webkit-text-size-adjust: none;
}
</style>
</html>
