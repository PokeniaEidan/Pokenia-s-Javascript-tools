<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Pokenia's Javascript Tools</title>
</head>
<body bgcolor="midnightblue ">
<div id="t1"></div>

<div id="count">
<input type="button" value="-" onclick="マイナス()" id="button">
<input type="button" value="+" onclick="プラス()" id="button">
</div>

<div id="t2"></div>
<input type="button" value="button" onclick="mes()" id="button">



<script src="ボキャブラリー・食べ物.js"></script>
<script src="ボキャブラリー・村.js"></script>
<script src="ボキャブラリー・人物.js"></script>
<script src="アイテム差分.js"></script>
<script src="ボキャブラリー・アイテム.js"></script>
<script src="駅.js"></script>
<script src="ボキャブラリー・その他.js"></script>
<script src="ニュース差分.js"></script>
<script src="スクロール.js"></script>
<script>
let num=0

function mes(){
main();
document.getElementById("t1").innerHTML = `＜本時のニュース＞<br>${ニュース本文[num]}<br>`;
}
mes();

function プラス(){
num++
document.getElementById("t2").innerHTML = `${num}`
mes();
}

function マイナス(){
num--
document.getElementById("t2").innerHTML = `${num}`
mes();
}

</script>
<style>
#button{
width: 10em;
height:5em;
}
#t1{
font-size: 20px;
color: white;
-webkit-text-size-adjust: none;
}
#t2{
-webkit-text-size-adjust: none;
color: white;
}  
</style>
</body>
</html>
