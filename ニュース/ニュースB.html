<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Pokenia's Javascript Tools</title>
</head>
<body>
<input type="button" value="もういちど" onclick="mes()" id="button">
<input type="button" value="保護する" onclick="save()" id="button">
<div id="t1"></div><br><br>
<div id="間">＜保護したニュース＞<br><br></div>
<div id="t2"></div>
<input type="button" value="削除" onclick="del()" id="button">

<script src="ボキャブラリーB.js"></script>
<script src="ニュース差分.js"></script>
<script src="ニュースティッカー.js"></script>
<script>
function mes(){

ボキャブラリー();
main();

document.getElementById("t1").innerHTML = `＜本時のニュース＞<br>${ニュース本文[ニュース乱数]}<br>`;
}
mes();



// ページ読み込み時に localStorage から復元
let array = [];
const saved = localStorage.getItem('key');
if (saved) {
  array = JSON.parse(saved);
}

// 乱数を配列に追加して保存
function save() {
array.unshift(ニュース本文[ニュース乱数]);
localStorage.setItem('key', JSON.stringify(array));
location.reload()
}

element=document.getElementById("t2");


for (let i = 0 ; i < array.length; i++){
  element.insertAdjacentHTML("beforeend",`${array[i]}<br><br>`);
}

function del(){
localStorage.clear();
location.reload()
}


</script>
<style>
#button{
width: 10em;
height:5em;
}
#t1{
font-size: 1.2em;
-webkit-text-size-adjust: none;
}
#間{
font-size: 1.2em;
-webkit-text-size-adjust: none;
}
#t2{
font-size: 1.2em;
-webkit-text-size-adjust: none;
}
</style>
</body>
</html>
