<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Pokenia's Javascript Tools</title>
</head>
<body>
<button id="dailyButton">更新</button>
<div id="t1"></div>
<div id="t2"></div>
<script src="ボキャブラリーB.js"></script>
<script src="駅.js"></script>
<script src="標語.js"></script>
<script src="提案.js"></script>
<script src="ニュースティッカー.js"></script>
<script>
ボキャブラリー();
main();
station();
haiku();
teian();

let randomValue = localStorage.getItem("myRandom");

if (randomValue === null) {
  randomValue = `
＜本時のニュース＞<br>${ニュース本文[ニュース乱数]}<br>
<br>＜本時の標語＞<br>${標語[標語乱数]}<br>
<br>＜本時のひとりごと＞<br>${ひとりごと[ひとりごと乱数]}<br>
<br>＜本時の提案＞<br>${提案}<br>
<br>＜本時のピックアップ作品＞<br>${女性[女性乱数2]}と${お宝[お宝乱数2]}<br>
<br>＜本時のピックアップ駅＞<br>${メトロ[メトロ乱数]}<br>
  `;

  localStorage.setItem("myRandom", randomValue);
}
document.getElementById("t1").innerHTML = `${randomValue}`


const button = document.getElementById("dailyButton");

// 今日の日付（YYYY-MM-DD）
//const today = new Date().toISOString().split("T")[0];
//const today = new Date().toString().split(":")[0];
const today = new Date().toString().slice(0, 20);

// 保存されている日付を取得
const lastClickedDate = localStorage.getItem("lastClickedDate");

// すでに今日押されていたら無効化
if (lastClickedDate === today) {
  button.disabled = true;
}

button.addEventListener("click", () => {
  // 押した日付を保存
  localStorage.setItem("lastClickedDate", today);

  button.disabled = true;

  // ここに実行したい処理を書く
  localStorage.removeItem('myRandom');
  location.reload()
});


</script>
<style>
#t1{
font-size: 1em;
}
</style>
</body>

</html>
